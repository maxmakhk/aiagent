<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision AI Agent - Florence-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .feature-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .section-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-secondary.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        select {
            padding: 12px;
            font-size: 1em;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        #imagePreview {
            margin: 20px 0;
            text-align: center;
        }

        #previewImage {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        #videoContainer {
            display: none;
            margin: 20px 0;
            text-align: center;
        }

        #video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #canvas {
            display: none;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            margin-top: 20px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .result-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.8;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        #fileInput {
            display: none;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #38ef7d;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Vision AI Agent</h1>
        <div class="subtitle">Third-Party Vision Integration via Local Model Server</div>
        
        <div class="features">
            <div class="feature-badge">🧠 AI Agent - Self-Modifiable</div>
            <div class="feature-badge">🔒 Local Secure Server</div>
            <div class="feature-badge">👁️ Vision Model: Florence-2</div>
        </div>

        <!-- Image Source Section -->
        <div class="section">
            <div class="section-title">📸 Image Source</div>
            <div class="button-group">
                <button class="btn-secondary active" id="uploadBtn" onclick="selectSource('upload')">
                    📂 Upload File
                </button>
                <button class="btn-secondary" id="cameraBtn" onclick="selectSource('camera')">
                    📷 Take Photo
                </button>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <!-- Image Preview / Camera -->
        <div id="imagePreview">
            <img id="previewImage" alt="Preview">
        </div>

        <div id="videoContainer">
            <video id="video" autoplay></video>
            <br>
            <button class="btn-primary" onclick="capturePhoto()" style="margin-top: 10px;">
                📸 Capture Photo
            </button>
        </div>

        <canvas id="canvas"></canvas>

        <!-- Analysis Mode Section -->
        <div class="section">
            <div class="section-title">🎯 Analysis Mode</div>
            <div class="button-group">
                <button class="btn-secondary active">Standard Analysis</button>
            </div>
        </div>

        <!-- Task Type Section -->
        <div class="section">
            <div class="section-title">📋 Task Type</div>
            <select id="taskType">
                <option value="<MORE_DETAILED_CAPTION>">Detailed Caption</option>
                <option value="<CAPTION>">Caption</option>
                <option value="<DETAILED_CAPTION>">Detailed Caption (Short)</option>
                <option value="<OD>">Object Detection</option>
                <option value="<DENSE_REGION_CAPTION>">Dense Region Caption</option>
                <option value="<REGION_PROPOSAL>">Region Proposal</option>
            </select>
        </div>

        <!-- Analyze Button -->
        <button class="analyze-btn" id="analyzeBtn" onclick="analyzeImage()" disabled>
            🚀 Analyze Image
        </button>

        <!-- Results Section -->
        <div id="results">
            <div class="section-title">
                <span class="status-indicator"></span> Analysis Results
            </div>
            <div class="result-content" id="resultContent"></div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">Analyzing image...</p>
        </div>
    </div>

    <script>
        let currentImageData = null;
        let stream = null;

        function selectSource(source) {
            const uploadBtn = document.getElementById('uploadBtn');
            const cameraBtn = document.getElementById('cameraBtn');
            const videoContainer = document.getElementById('videoContainer');
            const imagePreview = document.getElementById('imagePreview');
            const previewImage = document.getElementById('previewImage');

            if (source === 'upload') {
                uploadBtn.classList.add('active');
                cameraBtn.classList.remove('active');
                videoContainer.style.display = 'none';
                imagePreview.style.display = 'block';
                
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                
                document.getElementById('fileInput').click();
            } else {
                cameraBtn.classList.add('active');
                uploadBtn.classList.remove('active');
                imagePreview.style.display = 'none';
                previewImage.style.display = 'none';
                videoContainer.style.display = 'block';
                
                startCamera();
            }
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
            } catch (err) {
                alert('Error accessing camera: ' + err.message);
                console.error('Camera error:', err);
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewImage = document.getElementById('previewImage');
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    currentImageData = e.target.result;
                    document.getElementById('analyzeBtn').disabled = false;
                };
                reader.readAsDataURL(file);
            }
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            currentImageData = canvas.toDataURL('image/jpeg');
            
            const previewImage = document.getElementById('previewImage');
            previewImage.src = currentImageData;
            previewImage.style.display = 'block';
            
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('imagePreview').style.display = 'block';
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            document.getElementById('analyzeBtn').disabled = false;
        }

        async function analyzeImage() {
            if (!currentImageData) {
                alert('Please select or capture an image first');
                return;
            }

            const taskType = document.getElementById('taskType').value;
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const analyzeBtn = document.getElementById('analyzeBtn');

            loading.classList.remove('hidden');
            results.style.display = 'none';
            analyzeBtn.disabled = true;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: currentImageData,
                        task_type: taskType
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.result);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error analyzing image: ' + err.message);
                console.error('Analysis error:', err);
            } finally {
                loading.classList.add('hidden');
                analyzeBtn.disabled = false;
            }
        }

        function displayResults(result) {
            const results = document.getElementById('results');
            const resultContent = document.getElementById('resultContent');

            let formattedResult = '';
            if (typeof result === 'object') {
                formattedResult = JSON.stringify(result, null, 2);
                formattedResult = '<pre>' + formattedResult + '</pre>';
            } else {
                formattedResult = result;
            }

            resultContent.innerHTML = formattedResult;
            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth' });
        }

        // Check server health on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                console.log('Server health:', data);
            } catch (err) {
                console.error('Health check failed:', err);
            }
        });
    </script>
</body>
</html>
