<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shelf Rules Editor</title>
<meta name="theme-color" content="#0a0a0f">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
:root {
  --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c27;
  --accent:#00e5a0; --accent2:#7c6fff;
  --text:#f0f0f8; --muted:#6b6b88; --border:#2a2a3d;
  --danger:#ff5566; --warning:#ffaa00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh}

/* Header */
#header{padding:14px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
#header .logo{width:32px;height:32px;background:var(--accent2);border-radius:8px;display:flex;align-items:center;justify-content:center}
#header .logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
#header h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:20px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 12px;cursor:pointer;text-decoration:none;margin-left:auto}
.back-btn:hover{color:var(--text);border-color:var(--muted)}

/* Scrollable body */
#body{flex:1;overflow-y:auto;padding:14px 14px 90px}

/* Section title */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.section-title:first-child{margin-top:0}

/* Camera capture card */
#captureCard{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
#captureWrap{position:relative;width:100%;background:#000;display:none}
#captureWrap.show{display:block}
#captureVideo{width:100%;display:block;max-height:40dvh;object-fit:cover}
#captureCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
#captureActions{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap}
.cap-btn{flex:1;min-width:120px;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;padding:12px 10px;cursor:pointer;transition:opacity .15s,transform .1s}
.cap-btn:active{transform:scale(.97);opacity:.85}
.cap-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.cap-btn-cam{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.cap-btn-snap{background:var(--accent2);color:#fff}
.cap-btn-analyze{background:var(--accent);color:#000}

/* Sampled swatches */
#swatchRow{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap;display:none}
#swatchRow.show{display:flex}
.swatch{width:44px;height:44px;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:transform .1s,border-color .15s;flex-shrink:0;position:relative}
.swatch.selected{border-color:var(--accent);transform:scale(1.1)}
.swatch .swatch-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}

/* Analysis result preview */
#analysisResult{margin:0 14px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);display:none}
#analysisResult.show{display:block}

/* Rule cards */
.rule-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:border-color .2s}
.rule-card.editing{border-color:var(--accent2)}
.rule-card-header{display:flex;align-items:center;gap:10px;margin-bottom:0}
.rule-color-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.1)}
.rule-name-display{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule-card-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;padding:5px 8px;font-size:12px;font-family:'JetBrains Mono',monospace;transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.icon-btn.active{color:var(--accent2);border-color:rgba(124,111,255,.5);background:rgba(124,111,255,.08)}

/* Edit form */
.edit-form{margin-top:12px;display:none;flex-direction:column;gap:10px}
.edit-form.open{display:flex}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;
  padding:8px 10px;outline:none;width:100%;transition:border-color .2s
}
.field input:focus,.field select:focus{border-color:var(--accent2)}
.field select option{background:var(--surface2)}

/* Range slider with value display */
.range-wrap{display:flex;align-items:center;gap:6px}
.range-wrap input[type=range]{flex:1;accent-color:var(--accent2)}
.range-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent2);min-width:26px;text-align:right}

/* Colour preview bar */
.hsv-preview{height:8px;border-radius:4px;margin-top:4px;transition:background .2s}

/* Save/cancel row */
.form-save-row{display:flex;gap:8px;margin-top:4px}
.form-save-btn{flex:1;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;padding:12px;cursor:pointer;transition:opacity .15s,transform .1s}
.form-save-btn:active{transform:scale(.97)}
.btn-save{background:var(--accent2);color:#fff}
.btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)}

/* FAB */
#fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:18px;width:54px;height:54px;background:var(--accent2);border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s;box-shadow:0 4px 20px rgba(124,111,255,.4)}
#fab:active{transform:scale(.92)}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#000;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Empty state */
#emptyRules{text-align:center;padding:50px 20px;color:var(--muted);display:none}
#emptyRules svg{width:44px;height:44px;stroke:var(--muted);fill:none;margin-bottom:12px;opacity:.4}
#emptyRules p{font-size:14px}

/* JSON import/export */
.json-area{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:100%;min-height:80px;resize:vertical;outline:none;transition:border-color .2s}
.json-area:focus{border-color:var(--accent2)}
.io-row{display:flex;gap:8px;margin-top:8px}
.io-btn{flex:1;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px;cursor:pointer}
.io-btn-export{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.io-btn-import{background:var(--accent2);color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h8"/><circle cx="19" cy="17" r="3"/><path d="M17.5 17l1 1 2-2"/></svg>
    </div>
    <h1>Shelf Rules</h1>
    <a href="local_scanner.html" class="back-btn">← Scanner</a>
  </div>

  <div id="body">

    <!-- ── Camera Capture & Auto-Analyse ── -->
    <div class="section-title">Auto-detect from camera</div>
    <div id="captureCard">
      <div id="captureWrap">
        <video id="captureVideo" autoplay playsinline muted></video>
        <canvas id="captureCanvas"></canvas>
      </div>
      <div id="captureActions">
        <button class="cap-btn cap-btn-cam" id="camToggleBtn">📷 Open camera</button>
        <button class="cap-btn cap-btn-snap" id="snapBtn" style="display:none">⊙ Capture</button>
        <button class="cap-btn cap-btn-analyze" id="analyzeBtn" style="display:none" disabled>⚡ Analyse</button>
      </div>
    </div>

    <!-- Colour swatches from analysis -->
    <div id="swatchRow"></div>
    <div id="analysisResult"></div>

    <!-- ── Rules list ── -->
    <div class="section-title">Rules</div>
    <div id="rulesList"></div>
    <div id="emptyRules">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h12M3 18h8"/></svg>
      <p>No rules yet.<br>Tap + to add one.</p>
    </div>

    <!-- ── Import / Export ── -->
    <div class="section-title">Import / Export JSON</div>
    <textarea class="json-area" id="jsonArea" placeholder='Paste JSON rules here…'></textarea>
    <div class="io-row">
      <button class="io-btn io-btn-export" id="exportBtn">Export</button>
      <button class="io-btn io-btn-import" id="importBtn">Import</button>
    </div>

  </div><!-- /body -->
</div><!-- /app -->

<button id="fab" title="Add rule">+</button>
<div id="toast"></div>

<!-- OpenCV for colour analysis -->
<script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="onCvReady()"></script>
<script>
// ── Storage key (shared with scanner.html) ──
const STORAGE_KEY = 'shelfRules';

let rules = [];
let cvReady = false;
let cameraStream = null;
let capturedImageData = null; // ImageData from snapshot

// ── Default rules if nothing stored ──
const DEFAULT_RULES = [];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// ── Persistence ──
function loadRules(){
  try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):null}catch{return null}
}
function saveRules(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(rules));
}

function init(){
  const saved=loadRules();
  rules=saved&&saved.length?saved:[...DEFAULT_RULES];
  renderRules();
}

// ── Toast ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── HSV → display hsl ──
function hsvToHsl(h,s,v){
  const ss=s/255,vv=v/255,l=vv*(1-ss/2);
  const sl=l===0||l===1?0:(vv-l)/Math.min(l,1-l);
  return`hsl(${h*2},${Math.round(sl*100)}%,${Math.round(l*100)}%)`;
}
function midDot(rule){return hsvToHsl((rule.hMin+rule.hMax)/2,180,180)}

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function renderRules(){
  const list=document.getElementById('rulesList');
  const empty=document.getElementById('emptyRules');
  list.innerHTML='';
  empty.style.display=rules.length?'none':'block';

  rules.forEach((rule,idx)=>{
    const card=document.createElement('div');
    card.className='rule-card';
    card.dataset.id=rule.id;
    card.innerHTML=`
      <div class="rule-card-header">
        <div class="rule-color-dot" style="background:${midDot(rule)}"></div>
        <span class="rule-name-display">${rule.name}</span>
        <div class="rule-card-actions">
          <button class="icon-btn edit-btn" data-id="${rule.id}">✎</button>
          <button class="icon-btn danger del-btn" data-id="${rule.id}">✕</button>
        </div>
      </div>
      <!-- Edit form (hidden by default) -->
      <div class="edit-form" id="form-${rule.id}">
        ${buildForm(rule)}
      </div>
    `;
    list.appendChild(card);
    attachFormEvents(rule.id);
  });

  // Edit btn
  list.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click',()=>toggleEdit(btn.dataset.id));
  });
  // Delete btn
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click',()=>deleteRule(btn.dataset.id));
  });
}

function buildForm(rule){
  return`
  <div class="field">
    <label>Rule name</label>
    <input type="text" name="name" value="${rule.name}">
  </div>

  <div class="field">
    <label>Label (shown on camera)</label>
    <input type="text" name="label" value="${rule.label}">
  </div>

  <div class="field">
    <label>Overlay colour (hex)</label>
    <input type="text" name="color" value="${rule.color}" placeholder="#00e5a0">
  </div>

  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px">HSV colour range</div>
  <div class="hsv-preview" id="hprev-${rule.id}"></div>

  <div class="form-row3">
    <div class="field">
      <label>H min <span style="color:var(--accent2)" id="hMinV-${rule.id}">${rule.hMin}</span></label>
      <input type="range" name="hMin" min="0" max="179" value="${rule.hMin}" data-out="hMinV-${rule.id}">
    </div>
    <div class="field">
      <label>H max <span style="color:var(--accent2)" id="hMaxV-${rule.id}">${rule.hMax}</span></label>
      <input type="range" name="hMax" min="0" max="179" value="${rule.hMax}" data-out="hMaxV-${rule.id}">
    </div>
    <div class="field" style="justify-content:flex-end">
      <label>Shape</label>
      <select name="shape">
        <option value="rect" ${rule.shape==='rect'?'selected':''}>rect</option>
        <option value="any"  ${rule.shape==='any' ?'selected':''}>any</option>
        <option value="wide" ${rule.shape==='wide'?'selected':''}>wide</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label>S min <span style="color:var(--accent2)" id="sMinV-${rule.id}">${rule.sMin}</span></label>
      <input type="range" name="sMin" min="0" max="255" value="${rule.sMin}" data-out="sMinV-${rule.id}">
    </div>
    <div class="field">
      <label>S max <span style="color:var(--accent2)" id="sMaxV-${rule.id}">${rule.sMax}</span></label>
      <input type="range" name="sMax" min="0" max="255" value="${rule.sMax}" data-out="sMaxV-${rule.id}">
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label>V min <span style="color:var(--accent2)" id="vMinV-${rule.id}">${rule.vMin}</span></label>
      <input type="range" name="vMin" min="0" max="255" value="${rule.vMin}" data-out="vMinV-${rule.id}">
    </div>
    <div class="field">
      <label>V max <span style="color:var(--accent2)" id="vMaxV-${rule.id}">${rule.vMax}</span></label>
      <input type="range" name="vMax" min="0" max="255" value="${rule.vMax}" data-out="vMaxV-${rule.id}">
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label>Aspect min</label>
      <input type="number" name="aspectMin" step="0.1" min="0.1" value="${rule.aspectMin}">
    </div>
    <div class="field">
      <label>Aspect max</label>
      <input type="number" name="aspectMax" step="0.1" min="1" value="${rule.aspectMax}">
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label>Area min (px²)</label>
      <input type="number" name="areaMin" step="100" min="0" value="${rule.areaMin}">
    </div>
    <div class="field">
      <label>Area max (px²)</label>
      <input type="number" name="areaMax" step="100" min="0" value="${rule.areaMax}">
    </div>
  </div>

  <div class="form-save-row">
    <button class="form-save-btn btn-cancel cancel-btn" data-id="${rule.id}">Cancel</button>
    <button class="form-save-btn btn-save save-btn" data-id="${rule.id}">Save rule</button>
  </div>
  `;
}

function attachFormEvents(id){
  const form=document.getElementById(`form-${id}`);
  if(!form)return;

  // Range → live display
  form.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const out=document.getElementById(inp.dataset.out);
      if(out)out.textContent=inp.value;
      updateHsvPreview(id,form);
    });
  });

  updateHsvPreview(id,form);

  form.querySelector('.save-btn').addEventListener('click',()=>saveRule(id,form));
  form.querySelector('.cancel-btn').addEventListener('click',()=>toggleEdit(id,false));
}

function updateHsvPreview(id,form){
  const hMin=+form.querySelector('[name=hMin]').value;
  const hMax=+form.querySelector('[name=hMax]').value;
  const prev=document.getElementById(`hprev-${id}`);
  if(!prev)return;
  const c1=`hsl(${hMin*2},80%,50%)`;
  const c2=`hsl(${hMax*2},80%,50%)`;
  prev.style.background=`linear-gradient(to right,${c1},${c2})`;
}

function toggleEdit(id, forceOpen){
  const form=document.getElementById(`form-${id}`);
  const card=form?.closest('.rule-card');
  if(!form)return;
  const willOpen=forceOpen!==undefined?forceOpen:!form.classList.contains('open');
  form.classList.toggle('open',willOpen);
  card?.classList.toggle('editing',willOpen);
  const btn=card?.querySelector('.edit-btn');
  btn?.classList.toggle('active',willOpen);
}

function saveRule(id,form){
  const idx=rules.findIndex(r=>r.id===id);
  if(idx<0)return;
  const r=rules[idx];
  r.name      = form.querySelector('[name=name]').value.trim()||r.name;
  r.label     = form.querySelector('[name=label]').value.trim()||r.label;
  r.color     = form.querySelector('[name=color]').value.trim()||r.color;
  r.hMin      = +form.querySelector('[name=hMin]').value;
  r.hMax      = +form.querySelector('[name=hMax]').value;
  r.sMin      = +form.querySelector('[name=sMin]').value;
  r.sMax      = +form.querySelector('[name=sMax]').value;
  r.vMin      = +form.querySelector('[name=vMin]').value;
  r.vMax      = +form.querySelector('[name=vMax]').value;
  r.shape     = form.querySelector('[name=shape]').value;
  r.aspectMin = +form.querySelector('[name=aspectMin]').value;
  r.aspectMax = +form.querySelector('[name=aspectMax]').value;
  r.areaMin   = +form.querySelector('[name=areaMin]').value;
  r.areaMax   = +form.querySelector('[name=areaMax]').value;
  saveRules();
  renderRules();
  showToast('Rule saved ✓');
}

function deleteRule(id){
  if(!confirm('Delete this rule?'))return;
  rules=rules.filter(r=>r.id!==id);
  saveRules();
  renderRules();
  showToast('Deleted');
}

function addNewRule(){
  const newRule={
    id:uid(),name:'New rule',
    hMin:0,hMax:30,sMin:80,sMax:255,vMin:80,vMax:255,
    shape:'rect',aspectMin:.5,aspectMax:3,
    areaMin:1000,areaMax:30000,
    label:'Object',color:'#7c6fff',enabled:true
  };
  rules.push(newRule);
  saveRules();
  renderRules();
  // Auto-open the new card
  setTimeout(()=>toggleEdit(newRule.id,true),50);
  document.getElementById('body').scrollTo({top:99999,behavior:'smooth'});
}

// ══════════════════════════════════════════════
// CAMERA & OPENCV ANALYSIS
// ══════════════════════════════════════════════
const capVideo  = document.getElementById('captureVideo');
const capCanvas = document.getElementById('captureCanvas');
const capCtx    = capCanvas.getContext('2d');

document.getElementById('camToggleBtn').addEventListener('click',()=>{
  if(cameraStream){stopCamera();return;}
  startCapCamera();
});

async function startCapCamera(){
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    capVideo.srcObject=cameraStream;
    document.getElementById('captureWrap').classList.add('show');
    document.getElementById('camToggleBtn').textContent='✕ Close camera';
    document.getElementById('snapBtn').style.display='';
    document.getElementById('analyzeBtn').style.display='none';
    capturedImageData=null;
  }catch(e){showToast('Camera error: '+e.message)}
}
function stopCamera(){
  cameraStream?.getTracks().forEach(t=>t.stop());
  cameraStream=null;
  document.getElementById('captureWrap').classList.remove('show');
  document.getElementById('camToggleBtn').textContent='📷 Open camera';
  document.getElementById('snapBtn').style.display='none';
  document.getElementById('analyzeBtn').style.display='none';
}

document.getElementById('snapBtn').addEventListener('click',()=>{
  // Capture frame to canvas
  capCanvas.width  = capVideo.videoWidth  ||640;
  capCanvas.height = capVideo.videoHeight ||480;
  capCtx.drawImage(capVideo,0,0,capCanvas.width,capCanvas.height);
  capturedImageData = capCtx.getImageData(0,0,capCanvas.width,capCanvas.height);
  stopCamera();
  document.getElementById('captureWrap').classList.add('show'); // show captured frame
  // Show analysed image on canvas (video is gone)
  capCanvas.style.position='relative';
  capCanvas.style.display='block';
  capCanvas.style.width='100%';
  document.getElementById('analyzeBtn').style.display='';
  document.getElementById('analyzeBtn').disabled = !cvReady;
  if(!cvReady) document.getElementById('analyzeBtn').textContent='⏳ Waiting for OpenCV…';
  showToast('Captured! Tap Analyse to detect colours');
});

function onCvReady(){
  cvReady=true;
  const btn=document.getElementById('analyzeBtn');
  if(btn){btn.disabled=false;btn.textContent='⚡ Analyse';}
}

document.getElementById('analyzeBtn').addEventListener('click', analyseImage);

function analyseImage(){
  if(!capturedImageData){showToast('No captured image');return;}
  if(!cvReady){showToast('OpenCV not ready yet');return;}

  const btn=document.getElementById('analyzeBtn');
  btn.disabled=true; btn.textContent='Analysing…';

  try{
    // Put image into a temp canvas for cv.imread
    const tmp=document.createElement('canvas');
    tmp.width=capturedImageData.width; tmp.height=capturedImageData.height;
    tmp.getContext('2d').putImageData(capturedImageData,0,0);

    const src=cv.imread(tmp);
    const hsv=new cv.Mat();
    cv.cvtColor(src,hsv,cv.COLOR_RGBA2RGB);
    cv.cvtColor(hsv,hsv,cv.COLOR_RGB2HSV);

    // ── K-means clustering on HSV to find dominant colours ──
    // Subsample for speed (every 4th pixel)
    const step=4;
    const pts=[];
    const data=capturedImageData.data;
    for(let i=0;i<data.length;i+=4*step){
      const r=data[i],g=data[i+1],b=data[i+2];
      if(r===0&&g===0&&b===0)continue;
      pts.push([r,g,b]);
    }

    // Simple k=8 means in RGB, then convert representative to HSV
    const clusters = kMeans(pts,8,15);

    // Draw swatches + draw bounding cluster boxes on image
    drawSwatches(clusters,src,hsv);

    src.delete(); hsv.delete();
  }catch(e){
    console.error(e);
    showToast('Analysis error: '+e.message);
  }finally{
    btn.disabled=false; btn.textContent='⚡ Analyse';
  }
}

// ── Tiny k-means in RGB ──
function kMeans(pts,k,iters){
  if(pts.length<k)return pts.map(p=>({center:p,count:1}));
  // Init: pick k random unique points
  let centers=[];
  const used=new Set();
  while(centers.length<k){
    const i=Math.floor(Math.random()*pts.length);
    if(!used.has(i)){used.add(i);centers.push([...pts[i]]);}
  }
  for(let it=0;it<iters;it++){
    const sums=centers.map(()=>[0,0,0,0]); // r,g,b,count
    for(const p of pts){
      let best=0,bestD=Infinity;
      for(let c=0;c<centers.length;c++){
        const d=(p[0]-centers[c][0])**2+(p[1]-centers[c][1])**2+(p[2]-centers[c][2])**2;
        if(d<bestD){bestD=d;best=c;}
      }
      sums[best][0]+=p[0];sums[best][1]+=p[1];sums[best][2]+=p[2];sums[best][3]++;
    }
    centers=sums.map((s,i)=>s[3]>0?[s[0]/s[3],s[1]/s[3],s[2]/s[3]]:centers[i]);
  }
  // Count members
  const counts=new Array(k).fill(0);
  for(const p of pts){
    let best=0,bestD=Infinity;
    for(let c=0;c<centers.length;c++){
      const d=(p[0]-centers[c][0])**2+(p[1]-centers[c][1])**2+(p[2]-centers[c][2])**2;
      if(d<bestD){bestD=d;best=c;}
    }
    counts[best]++;
  }
  return centers
    .map((c,i)=>({center:c,count:counts[i]}))
    .filter(c=>c.count>0)
    .sort((a,b)=>b.count-a.count)
    .slice(0,6);
}

// RGB [0-255] → HSV OpenCV format (H:0-179, S:0-255, V:0-255)
function rgbToHsv(r,g,b){
  const rr=r/255,gg=g/255,bb=b/255;
  const max=Math.max(rr,gg,bb),min=Math.min(rr,gg,bb),d=max-min;
  let h=0;
  if(d!==0){
    if(max===rr)      h=((gg-bb)/d)%6;
    else if(max===gg) h=(bb-rr)/d+2;
    else              h=(rr-gg)/d+4;
  }
  h=Math.round((h/6)*180+180)%180;
  const s=max===0?0:Math.round(d/max*255);
  const v=Math.round(max*255);
  return{h,s,v};
}

function drawSwatches(clusters, srcMat, hsvMat){
  const row=document.getElementById('swatchRow');
  row.innerHTML='';
  row.classList.add('show');

  const swatchData=[];

  clusters.forEach((cl,i)=>{
    const [r,g,b]=cl.center.map(Math.round);
    const {h,s,v}=rgbToHsv(r,g,b);
    const hex=`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;

    const sw=document.createElement('div');
    sw.className='swatch';
    sw.style.background=hex;
    sw.dataset.idx=i;
    sw.innerHTML=`<span class="swatch-label">${Math.round(cl.count/(clusters.reduce((a,c)=>a+c.count,0))*100)}%</span>`;
    sw.addEventListener('click',()=>useSwatchAsRule(cl,h,s,v,hex));
    row.appendChild(sw);
    swatchData.push({cl,h,s,v,hex,pct:Math.round(cl.count/(clusters.reduce((a,c)=>a+c.count,0))*100)});
  });

  // Show summary
  const res=document.getElementById('analysisResult');
  res.innerHTML=swatchData.map(d=>
    `<span style="color:${d.hex}">■</span> H:${d.h} S:${d.s} V:${d.v} (${d.pct}%)&nbsp;&nbsp;`
  ).join('<br>');
  res.classList.add('show');

  // Draw cluster outlines on canvas using OpenCV
  try{
    clusters.forEach(cl=>{
      const [r,g,b]=cl.center.map(Math.round);
      const{h,s,v}=rgbToHsv(r,g,b);
      const tol=15;
      const lower=new cv.Mat(hsvMat.rows,hsvMat.cols,hsvMat.type(),[Math.max(0,h-tol),Math.max(0,s-60),Math.max(0,v-60),0]);
      const upper=new cv.Mat(hsvMat.rows,hsvMat.cols,hsvMat.type(),[Math.min(179,h+tol),Math.min(255,s+60),Math.min(255,v+60),255]);
      const mask=new cv.Mat();
      cv.inRange(hsvMat,lower,upper,mask);
      const ker=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));
      cv.morphologyEx(mask,mask,cv.MORPH_CLOSE,ker);
      const ctrs=new cv.MatVector(),hier=new cv.Mat();
      cv.findContours(mask,ctrs,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
      for(let i=0;i<ctrs.size();i++){
        const cnt=ctrs.get(i);
        if(cv.contourArea(cnt)>500){
          const rect=cv.boundingRect(cnt);
          cv.rectangle(srcMat,new cv.Point(rect.x,rect.y),new cv.Point(rect.x+rect.width,rect.y+rect.height),new cv.Scalar(r,g,b,255),2);
        }
        cnt.delete();
      }
      lower.delete();upper.delete();mask.delete();ker.delete();ctrs.delete();hier.delete();
    });
    cv.imshow(capCanvas,srcMat);
  }catch(e){console.warn('draw error',e)}
}

function useSwatchAsRule(cl,h,s,v,hex){
  const tol=18, stol=60, vtol=60;
  const newRule={
    id:uid(),
    name:'Detected colour '+new Date().toLocaleTimeString(),
    hMin:Math.max(0,h-tol), hMax:Math.min(179,h+tol),
    sMin:Math.max(0,s-stol),sMax:Math.min(255,s+stol),
    vMin:Math.max(0,v-vtol),vMax:Math.min(255,v+vtol),
    shape:'rect',aspectMin:.4,aspectMax:5,
    areaMin:500,areaMax:50000,
    label:'Object',color:hex,enabled:true
  };
  rules.push(newRule);
  saveRules();
  renderRules();
  document.getElementById('body').scrollTo({top:99999,behavior:'smooth'});
  setTimeout(()=>toggleEdit(newRule.id,true),80);
  showToast('Rule created from swatch — review & save ✓');
}

// ══════════════════════════════════════════════
// FAB + IMPORT/EXPORT
// ══════════════════════════════════════════════
document.getElementById('fab').addEventListener('click', addNewRule);

document.getElementById('exportBtn').addEventListener('click',()=>{
  document.getElementById('jsonArea').value=JSON.stringify(rules,null,2);
  showToast('Exported to text area');
});

document.getElementById('importBtn').addEventListener('click',()=>{
  try{
    const parsed=JSON.parse(document.getElementById('jsonArea').value);
    if(!Array.isArray(parsed))throw new Error('Expected array');
    rules=parsed.map(r=>({...r,id:r.id||uid()}));
    saveRules();
    renderRules();
    showToast('Imported '+rules.length+' rules ✓');
  }catch(e){showToast('Invalid JSON: '+e.message)}
});

init();
</script>
